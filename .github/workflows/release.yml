name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: stable
      - run: dart pub get
      - name: Check the tag matches the code
        run: |
          version="${GITHUB_REF_NAME#v}"
          grep -qx "version: $version" pubspec.yaml || { echo "pubspec.yaml is not at $version"; exit 1; }
          dart run tool/release.dart notes "$version" > release-notes.md
      - name: Test
        run: dart test
        env:
          FLUTTER_NETWORK_MCP_NO_TELEMETRY: 'true'
          FLUTTER_NETWORK_MCP_NO_UPDATE_CHECK: 'true'
      - name: Publish the GitHub Release
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file release-notes.md
        env:
          GH_TOKEN: ${{ github.token }}
